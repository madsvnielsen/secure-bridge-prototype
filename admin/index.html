<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hococo Admin Hub – Pair Bridge</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #020617;
        color: #e5e7eb;
        padding: 2rem;
      }
      .card {
        max-width: 420px;
        padding: 1.5rem;
        border-radius: 0.75rem;
        background: #0f172a;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      }
      label, input, button {
        display: block;
        width: 80%;
      }
      label {
        font-size: 0.9rem;
        margin-bottom: 0.25rem;
      }
      input {
        padding: 0.6rem 0.8rem;
        border-radius: 0.5rem;
        border: 1px solid #1f2937;
        margin-bottom: 0.75rem;
        background: #020617;
        color: #e5e7eb;
      }
      button {
        padding: 0.6rem 0.8rem;
        border-radius: 0.5rem;
        border: none;
        background: #4f46e5;
        color: white;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      pre {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 0.5rem;
        background: #020617;
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 600px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pair a Bridge</h1>
       <label for="bridgeName">Bridge name</label>
       <input id="bridgeName"  />
      <p>Enter the 6-digit pairing code shown on the Bridge.</p>

      <label for="code">Pairing code</label>
      <input id="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />

      <button id="claimBtn">Claim Bridge</button>

      <pre id="output"></pre>
    </div>

    <script>
      const btn = document.getElementById("claimBtn");
      const codeInput = document.getElementById("code");
      const out = document.getElementById("output");

        const nameInput = document.getElementById("bridgeName");

   

      btn.addEventListener("click", async () => {
        const code = codeInput.value.trim();

        if (!/^\d{6}$/.test(code)) {
          out.textContent = "Please enter a 6-digit numeric code.";
          return;
        }

        btn.disabled = true;
        out.textContent = "Claiming bridge with code " + code + "...";

        try {
           const res = await fetch("https://localhost:8443/api/hub/pair/claim", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                pairingCode: code,
                bridgeName: nameInput.value || "Unnamed Bridge",
            }),
            });

          const text = await res.text();
          let data;
          try { data = JSON.parse(text); } catch { data = text; }

          if (!res.ok) {
            out.textContent = "Error " + res.status + ":\n" + JSON.stringify(data, null, 2);
            return;
          }

          out.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          out.textContent = "Network error: " + err.message;
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
