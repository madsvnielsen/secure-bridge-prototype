networks:
  net_internet: {}
  net_cloud:
    internal: true
  net_onprem:
    internal: true

services:
  edge:
    container_name: edge
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./api/certs/api:/etc/nginx/certs/api:ro
      - ./api/certs/ws:/etc/nginx/certs/ws:ro
      - ./api/certs/ca/ca.crt:/etc/nginx/certs/ca/hococo_ca.crt:ro
    depends_on: [api, ws]
    networks:
      net_internet:
        aliases:
          - api.hococo.internal
          - ws.hococo.internal
      net_cloud:
        aliases:
          - api.hococo.internal
          - ws.hococo.internal

  api:
    container_name: api
    build: ./api
    environment:
      - APP_ENV=local
    networks: [net_internet, net_cloud]



  ws:
    container_name: ws
    build: ./ws
    environment:
      - PORT=8080
    networks: [net_cloud]

  bridge:
    container_name: bridge
    build: ./bridge
    environment:
      - BRIDGE_API_CA_PATH=/etc/ssl/certs/hococo_ca.crt
      - BRIDGE_STATE_DIR=/var/lib/hococo-bridge
    volumes:
      - ./api/certs/ca/ca.crt:/etc/ssl/certs/hococo_ca.crt:ro
    ports:
      - "18080:8080"
    networks: [net_onprem, net_internet]

  admin:
    container_name: admin
    build: ./admin
    ports:
      - "3000:80"
    networks: [net_internet]
