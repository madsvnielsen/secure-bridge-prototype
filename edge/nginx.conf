events {}

http {
    upstream api_upstream {
        server api:8000;
    }

    upstream ws_upstream {
        server ws:8080;
    }

    server {
        listen 80;
        server_name localhost api.hococo.internal ws.hococo.internal;

        return 301 https://$host$request_uri;
    }

    # ---- HTTPS: API host ----
    server {
        listen 443 ssl;
        server_name api.hococo.internal localhost;

        ssl_certificate     /etc/nginx/certs/api/api.crt;
        ssl_certificate_key /etc/nginx/certs/api/api.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

       location /api/ {
            proxy_pass http://api_upstream; 
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }

    # ---- HTTPS: WS host ----
    server {
        listen 443 ssl;
        server_name ws.hococo.internal;

        ssl_certificate     /etc/nginx/certs/ws/ws.crt;
        ssl_certificate_key /etc/nginx/certs/ws/ws.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /ws/ {
            proxy_pass http://ws_upstream/;
            rewrite /ws/(.*) /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
