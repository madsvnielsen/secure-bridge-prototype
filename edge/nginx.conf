events {}

http {
    upstream api_upstream {
        server api:8000;
        server api:8001;
    }

    upstream ws_upstream {
        server ws:8080;
    }

    server {
        listen 80;
        server_name localhost api.hococo.internal;

        return 301 https://$host$request_uri;
    }

    # ---- HTTPS: API host ----
   server {
    listen 443 ssl;
    server_name api.hococo.internal localhost;

    ssl_certificate     /etc/nginx/certs/api/api.crt;
    ssl_certificate_key /etc/nginx/certs/api/api.key;
    ssl_client_certificate /etc/nginx/certs/ca/hococo_ca.crt;
    ssl_crl               /etc/nginx/crl/bridge.crl.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ssl_verify_client optional;

    # mTLS
    location ~ ^/api/bridges/[^/]+/token$ {

        # require a valid client certificate here
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        proxy_pass http://api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass mTLS info through to Laravel
        proxy_set_header ssl-client-cert       $ssl_client_escaped_cert;
        proxy_set_header ssl-client-subject-dn $ssl_client_s_dn;
        proxy_set_header ssl-client-issuer-dn  $ssl_client_i_dn;
    }

    location ~ ^/api/bridges/result$ {

        # require a valid client certificate here
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        proxy_pass http://api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass mTLS info through to Laravel
        proxy_set_header ssl-client-cert       $ssl_client_escaped_cert;
        proxy_set_header ssl-client-subject-dn $ssl_client_s_dn;
        proxy_set_header ssl-client-issuer-dn  $ssl_client_i_dn;
    }

    # ---- Normal API no mTLS ----
    location /api/ {
        proxy_pass http://api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

   # ---- HTTPS: WS host ----
   server {
        listen 9443 ssl;
        server_name ws.hococo.internal;

        ssl_certificate     /etc/nginx/certs/ws/ws.crt;
        ssl_certificate_key /etc/nginx/certs/ws/ws.key;
        ssl_client_certificate /etc/nginx/certs/ca/hococo_ca.crt;
        ssl_crl               /etc/nginx/crl/bridge.crl.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_verify_client on;

        error_log /nginx_error.log debug;

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
            proxy_set_header ssl-client-subject-dn $ssl_client_s_dn;
            proxy_set_header ssl-client-issuer-dn $ssl_client_i_dn;
            proxy_pass http://ws_upstream; 

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /admin/ws {
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header ssl-client-cert       $ssl_client_escaped_cert;
            proxy_set_header ssl-client-subject-dn $ssl_client_s_dn;
            proxy_set_header ssl-client-issuer-dn  $ssl_client_i_dn;

            proxy_pass http://ws_upstream;
        }

    }
}

